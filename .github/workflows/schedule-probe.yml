name: Schedule Probe

on:
  schedule:
    - cron: "11,26,41,56 * * * *"  # Every 15 minutes at offset minutes
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Emit probe details
        run: |
          echo "schedule probe fired"
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          date -u