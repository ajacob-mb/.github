name: Label Taxonomy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "introduce"
        type: choice
        options:
          - introduce
          - migrate
          - enforce

      stage:
        description: "Rollout stage (defined in staged-migration.json)"
        required: true
        default: "stage1"
        type: choice
        options:
          - stage1
          - stage2
          - all

env:
  MODE: ${{ inputs.mode }}
  STAGE: ${{ inputs.stage }}

jobs:
  labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ GitHub App Token
      - name: Generate GitHub App Token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          installation_id: ${{ secrets.GH_INSTALLATION_ID }}

      # ✅ Main execution
      - name: Run Label Taxonomy
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');

            const MODE = process.env.MODE;
            const STAGE = process.env.STAGE;

            console.log(`\n==============================`);
            console.log(`🚀 MODE: ${MODE}`);
            console.log(`📦 STAGE: ${STAGE}`);

            // ✅ Load config files
            const labels = JSON.parse(fs.readFileSync('./.github/label-config/labels.json'));
            const mapping = JSON.parse(fs.readFileSync('./.github/label-config/label-mapping.json'));
            const staging = JSON.parse(fs.readFileSync('./.github/label-config/staged-migration.json'));

            // ✅ Validation (important!)
            if (!Array.isArray(labels)) {
              throw new Error("labels.json must be an array");
            }

            if (typeof mapping !== 'object') {
              throw new Error("label-mapping.json must be an object");
            }

            if (!staging[STAGE]) {
              throw new Error(`Stage "${STAGE}" not found in staged-migration.json`);
            }

            if (!Array.isArray(staging[STAGE])) {
              throw new Error(`Stage "${STAGE}" must be an array of repos`);
            }

            const repos = staging[STAGE];

            console.log(`📁 TOTAL REPOS: ${repos.length}`);
            console.log(`📁 REPO LIST:`, repos);

            for (const repoFull of repos) {
              const [owner, repo] = repoFull.split('/');

              console.log(`\n==============================`);
              console.log(`🔁 Processing ${repoFull}`);

              // ✅ Get existing labels
              const existing = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo }
              );

              const existingMap = new Map(existing.map(l => [l.name, l]));
              const taxonomyNames = new Set(labels.map(l => l.name));

              // ============================
              // ✅ STEP 1 — Create / Update
              // ============================
              for (const label of labels) {

                if (!existingMap.has(label.name)) {
                  console.log(`➕ Creating ${label.name}`);

                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description || ''
                  });

                } else {
                  const existingLabel = existingMap.get(label.name);

                  if (
                    existingLabel.color !== label.color ||
                    (existingLabel.description || '') !== (label.description || '')
                  ) {
                    console.log(`♻️ Updating ${label.name}`);

                    await github.rest.issues.updateLabel({
                      owner,
                      repo,
                      name: label.name,
                      color: label.color,
                      description: label.description || ''
                    });
                  }
                }
              }

              // ============================
              // ✅ STEP 2 — Migrate Issues
              // ============================
              if (MODE !== "introduce") {

                const issues = await github.paginate(
                  github.rest.issues.listForRepo,
                  { owner, repo, state: "all" }
                );

                console.log(`📄 Processing ${issues.length} issues`);

                for (const issue of issues) {
                  const currentLabels = issue.labels.map(l => l.name);

                  for (const oldLabel of currentLabels) {
                    if (mapping[oldLabel]) {
                      const newLabel = mapping[oldLabel];

                      if (!currentLabels.includes(newLabel)) {
                        console.log(`➡️ Issue #${issue.number}: ${oldLabel} → ${newLabel}`);

                        await github.rest.issues.addLabels({
                          owner,
                          repo,
                          issue_number: issue.number,
                          labels: [newLabel]
                        });
                      }
                    }
                  }
                }
              }

              // ============================
              // ✅ STEP 3 — Enforce Cleanup
              // ============================
              if (MODE === "enforce") {

                console.log(`🧹 Cleaning up non-taxonomy labels`);

                for (const label of existing) {
                  if (!taxonomyNames.has(label.name)) {
                    console.log(`🗑 Deleting ${label.name}`);

                    await github.rest.issues.deleteLabel({
                      owner,
                      repo,
                      name: label.name
                    });
                  }
                }
              }

              console.log(`✅ Completed ${repoFull}`);
            }

            console.log(`\n✅✅ ALL DONE`);