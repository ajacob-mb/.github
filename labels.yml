# ------------------
# Type (Required)
# Blue palette → classification
# ------------------
- name: "type:bug"
  color: "df3d3d"
  description: "Defect or unintended behaviour in existing functionality"

- name: "type:feature"
  color: "1f883d"
  description: "New functionality or enhancement"

- name: "type:docs"
  color: "0969da"
  description: "Documentation change"

- name: "type:task"
  color: "8250df"
  description: "General work item or chore"


# ------------------
# Priority (Required)
# Traffic light colours → urgency
# ------------------
- name: "priority:high"
  color: "cf222e"
  description: "Address within current sprint (urgent)"

- name: "priority:medium"
  color: "fb8f00"
  description: "Normal priority"

- name: "priority:low"
  color: "2da44e"
  description: "Low urgency"


# ------------------
# Flag (Optional / Governance)
# Neutral / muted → workflow state
# ------------------
- name: "flag:blocked"
  color: "8b949e"
  description: "Blocked by dependency or decision"

- name: "flag:duplicate"
  color: "cfd3d7"
  description: "Issue already exists elsewhere"

- name: "flag:invalid"
  color: "6e7781"
  description: "Not valid or cannot be reproduced"

- name: "flag:rework"
  color: "bf8700"
  description: "Requires rework after review"

- name: "flag:wontfix"
  color: "5319e7"
  description: "Deliberately not actioned"
